<h3>班級閱讀村</h3><p id="village"></p></dialog></main><script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d'),plan=$('plan'),dialog=$('dialog');
const worldWidth=549,worldDepth=793,spawn={x:58,y:626};
const player={...spawn},keys=new Set(),solids=[],points=[],faces=[],stage=[];
const palette=['#ab6f55','#d3a55b','#849673','#829a9a','#b38b8c','#e0cda5','#f5e7c8'];
const wood=['#e4c299','#ba8d62','#a87850'];
const platform={x:160,y:147,w:214,d:270};
const defaultYaw=-.42,defaultPitch=.81,owl={x:99,y:650};
let width,height,lastView,zoom=1,yaw=defaultYaw,pitch=defaultPitch,frameTime=0,near,drag,active=true;
function item(name,x,y,w,d,blocking=true,description){
 const object={name,x,y,w,d,blocking,description};solids.push(object);return object;
}
function face(out,vertices,color){
 const center=vertices.reduce((p,v)=>[p[0]+v[0]/vertices.length,p[1]+v[1]/vertices.length,p[2]+v[2]/vertices.length],[0,0,0]);
 out.push({vertices,color,center});
}
function box(out,x,y,z,w,d,h,colors=wood){
 const a=[x,y,z],b=[x+w,y,z],c=[x+w,y+d,z],e=[x,y+d,z];
 const top=v=>[v[0],v[1],z+h];
 face(out,[top(a),top(b),top(c),top(e)],colors[0]);
 face(out,[a,b,top(b),top(a)],colors[1]);
 face(out,[e,c,top(c),top(e)],colors[1]);
 face(out,[b,c,top(c),top(b)],colors[2]||colors[1]);
 face(out,[a,e,top(e),top(a)],colors[2]||colors[1]);
}
function cylinder(x,y,r,z,h,colors){
 const point=(i,height)=>[x+Math.cos(i*Math.PI/8)*r,y+Math.sin(i*Math.PI/8)*r,height];
 face(faces,Array.from({length:16},(_,i)=>point(i,z+h)),colors[0]);
 for(let i=0;i<16;i++)face(faces,[point(i,z),point(i+1,z),point(i+1,z+h),point(i,z+h)],colors[1+i%2]);
}
function floorHeight(x,y){
 const p=platform;
 if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.d)return 12;
 return x>=p.x&&x<=p.x+p.w&&y>p.y+p.d&&y<=p.y+p.d+8?6:0;
}
function shelf(name,x,y,w,d,low){
 const height=low?27:63,alongX=w>=d,span=alongX?w:d;
 item(name,x,y,w,d,true,low?'這裡是主題展示矮櫃。':undefined);
 const rows=low?2:4,divisions=Math.max(1,Math.ceil(span/48)),bay=span/divisions;
 const trim=['#efd6b0','#c2a080','#ad8967'];
 for(let row=0;row<=rows;row++){
  const z=row*(height-3)/rows;
  box(faces,x,y,z,w,d,3,trim);
 }
 for(let i=0;i<=divisions;i++){
  const offset=Math.min(span-3,i*bay);
  box(faces,x+(alongX?offset:0),y+(alongX?0:offset),0,alongX?3:w,alongX?d:3,height,trim);
 }
 for(let row=0;row<rows;row++){
  const z=3+row*(height-3)/rows;
  for(let i=0;i<divisions;i++){
   for(let j=0;j<3;j++){
    const offset=i*bay+4+j*5.3;
    if(offset+3>(i+1)*bay-3||(row+i)%3===2&&j===2)continue;
    const color=palette[(i*3+row+j)%palette.length],back=(i+row)%2===0;
    const across=Math.min(alongX?d:w,12);
    const bx=alongX?x+offset:back?x+3:x+w-across-3;
    const by=alongX?(back?y+3:y+d-across-3):y+offset;
    const bookHeight=Math.min((height-3)/rows-4,7+(i+j*2)%5);
    box(faces,bx,by,z,alongX?4:across,alongX?across:4,bookHeight,[color,color,color]);
   }
  }
 }
}
function readingDesk(name,x,y,w,d){
 item(name,x,y,w,d);
 for(const dx of [3,w-7])for(const dy of [3,d-7])box(faces,x+dx,y+dy,0,4,4,23,['#a17a59','#795d46']);
 box(faces,x,y,23,w,d,5);
}
function build(){
 for(const g of plan.querySelectorAll('svg g[class]')){
  const rect=g.querySelector('rect'),kind=g.getAttribute('class'),[x,y,w,d]=['x','y','width','height'].map(a=>Number(rect.getAttribute(a)));
  const name=[...g.querySelectorAll('text:first-of-type tspan')].map(t=>t.textContent).join('').replace('│','–');
  if(kind==='shelf'||kind==='low'){shelf(name,x,y,w,d,kind==='low');continue;}
  if(kind==='door'){item('大門',x,y,w,d,false);box(faces,x,y,0,w,d,1,['#748567','#657559']);continue;}
  if(kind==='platform')continue;
  if(kind==='seat'&&name==='桌子'){readingDesk('閱覽桌',x,y,w,d);continue;}
  if(kind==='seat'&&name==='電腦區'){
   readingDesk(name,x,y,w,d);
   for(let dy=15;dy<d-12;dy+=35){
    box(faces,x+9,y+dy,28,7,15,16,['#68716b','#404849']);
    box(faces,x+20,y+dy,28,8,13,2,['#d1c7ae','#9b9686']);
   }
   continue;
  }
  item(name,x,y,w,d);
  const colors=kind==='community'?['#d5ddbd','#a5ae8c']:kind==='detail'?['#f0eee0','#c0b8a4']:['#c1c4a4','#969779'];
  const h=name==='窗'?2:name==='白板'?30:26;
  box(faces,x,y,0,w,d,h,colors);
 }
 box(stage,platform.x,platform.y,0,platform.w,platform.d+8,6,['#d2a878','#9c714e']);
 box(stage,platform.x,platform.y,6,platform.w,platform.d,6,['#dcb78a','#ac815b']);
 const curve=plan.querySelector('.s-shelf'),length=curve.getTotalLength();
 for(let i=0;i<=length;i+=9){
  const p=curve.getPointAtLength(i);
  item('漫畫、繪本',p.x-10,p.y-10,20,20,true,'中央兩階平台上的 S 形矮書架。');
  box(faces,p.x-10,p.y-10,12,20,20,20,['#ecd1a7','#bc946a','#a47c56']);
 }
 for(const tree of plan.querySelectorAll('.tree-base')){
  const group=tree.parentElement,[x,y]=group.getAttribute('transform').match(/[\d.]+/g).map(Number),name=group.querySelector('text').textContent;
  item(name,x-48,y-48,96,96,true,'這一區以大樹為地標，底部是環形書架。').radius=48;
  cylinder(x,y,48,0,15,['#edcfaa','#b79871','#c8aa80']);
  cylinder(x,y,34,15,36,['#ecd1ad','#a17d5d','#bb9571']);
  for(let i=0;i<16;i++){
   const a=i*Math.PI/8,bx=x+Math.cos(a)*34,by=y+Math.sin(a)*34,c=palette[i%palette.length];
   box(faces,bx-2,by-2,22,5,5,15,[c,c,c]);
  }

   if(!follow)heading=Math.atan2(oldX-player.x,oldY-player.y);
   stride=(stride+walked*.17)%(Math.PI*2);
  }
 }
 if(active&&dialog.hidden)owlWalk(dt);
 const view=[player.x,player.y,yaw,pitch,zoom,owl.x,owl.y,follow,movingPlayer,stride,profile?.name,profile?.look,readingData?.books.length,readingData?.gear].join("|");
 if(active&&width&&view!==lastView){
  lastView=view;
  near=nearest();$('action').disabled=!near;updateServices();
  $('location').textContent=near?.name??(floorHeight(player.x,player.y)?'漫畫、繪本平台':'館內走道');
  const cs=Math.cos(yaw),sn=Math.sin(yaw),sp=Math.sin(pitch),cp=Math.cos(pitch);
  const extentX=Math.abs(cs)*549+Math.abs(sn)*793;
  const extentY=(Math.abs(sn)*549+Math.abs(cs)*793)*sp+180*cp;
  const scale=(follow?Math.min(width/310,height/285):Math.min(width/(extentX+55),height/(extentY+45)))*zoom;
  const radius=follow?115:1120;
  let distance=96;
  if(follow)for(let d=28;d<96;d+=4){
   if(solids.some(o=>o.blocking&&player.x+sn*d>o.x-2&&player.x+sn*d<o.x+o.w+2&&player.y+cs*d>o.y-2&&player.y+cs*d<o.y+o.d+2)){distance=Math.max(33,d-9);break;}
  }
  const shift=follow?radius*cp-distance:0;
  const cx=follow?player.x-shift*sn:zoom>1?player.x:274.5,cy=follow?player.y-shift*cs:zoom>1?player.y:396.5;
  const viewDepth=(x,y,z)=>((x-cx)*sn+(y-cy)*cs)*cp+z*sp;
  const project=([x,y,z])=>{
   const across=(x-cx)*cs-(y-cy)*sn,along=(x-cx)*sn+(y-cy)*cs;
   const perspective=radius/Math.max(follow?20:260,radius-viewDepth(x,y,z));
   return [width/2+across*scale*perspective,height*(follow?.66:.54)+(along*sp-z*cp)*scale*perspective];
  };
  const polygon=(vertices,color)=>{
   if(follow){
    const clipped=[];
    for(let i=0;i<vertices.length;i++){
     const a=vertices[i],b=vertices[(i+1)%vertices.length],d1=radius-20-viewDepth(...a),d2=radius-20-viewDepth(...b);
     if(d1>=0)clipped.push(a);
     if((d1>=0)!==(d2>=0)){const t=d1/(d1-d2);clipped.push(a.map((v,j)=>v+(b[j]-v)*t));}
    }
    if(clipped.length<3)return;
    vertices=clipped;
   }
   ctx.fillStyle=color;ctx.beginPath();
   vertices.forEach((v,i)=>{const p=project(v);if(i)ctx.lineTo(...p);else ctx.moveTo(...p);});
   ctx.closePath();ctx.fill();
  };
  const sky=ctx.createLinearGradient(0,0,0,height);sky.addColorStop(0,'#343b48');sky.addColorStop(1,'#1c222b');ctx.fillStyle=sky;ctx.fillRect(0,0,width,height);
  for(let y=0;y<worldDepth;y+=11)polygon([[0,y,0],[549,y,0],[549,Math.min(y+11,793),0],[0,Math.min(y+11,793),0]],['#d9b88c','#d4b184','#dcbd95'][Math.floor(y/11)%3]);
  stage.forEach(f=>polygon(f.vertices,f.color));
  const moving=[];drawWalker(moving);mascot(moving);librarian(moving);
  const depth=f=>viewDepth(...f.center);
  [...faces,...moving].sort((a,b)=>depth(a)-depth(b)).forEach(f=>polygon(f.vertices,f.color));
  const [mx,my]=project([owl.x,owl.y,76]);
  ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  if(!follow||viewDepth(owl.x,owl.y,76)<radius-20){
  ctx.fillStyle='#5a704c';ctx.beginPath();ctx.roundRect(mx-45,my-12,90,24,9);ctx.fill();
  ctx.fillStyle='#fff8dc';ctx.fillText('迎賓貓頭鷹',mx,my);
  }
  ctx.font='600 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  const labels=profile?[...points,{x:player.x,y:player.y,z:floorHeight(player.x,player.y)+58,name:profile.name}]:points;
  for(const p of labels){
   if(follow&&viewDepth(p.x,p.y,p.z)>=radius-20)continue;
   const [x,y]=project([p.x,p.y,p.z]);const w=ctx.measureText(p.name).width+14;
   ctx.fillStyle='#fff7e6';ctx.beginPath();ctx.roundRect(x-w/2,y-10,w,20,6);ctx.fill();ctx.fillStyle='#394334';ctx.fillText(p.name,x,y);
  }
 }
 requestAnimationFrame(render);
}
function openInteraction(){

}

  $('profileMessage').textContent='請使用上方的測試帳號及密碼。';return;
